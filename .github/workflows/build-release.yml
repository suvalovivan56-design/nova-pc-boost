name: Build Windows EXE and publish release
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'app/**'
      - 'requirements.txt'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Build standalone EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name NOVA_PC_BOOST --collect-all psutil app/NovaPCBoost.py
      - name: Publish EXE to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.4.0' }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $notes = @'
          NOVA PC BOOST v1.4.0 — обновлённый Windows-интерфейс.

          • Новый тёмный Control Center
          • Профили CS2, Rust и Dota 2
          • Каталог Windows-твиков
          • Резервные копии и откат применённых параметров
          • Мониторинг CPU, RAM и диска
          • Системные инструменты и очистка временных файлов старше 48 часов

          Проверьте EXE антивирусом перед запуском.
          '@
          gh release create $tag "dist/NOVA_PC_BOOST.exe" --title "NOVA PC BOOST $tag" --notes $notes --latest
          if ($LASTEXITCODE -ne 0) {
            gh release upload $tag "dist/NOVA_PC_BOOST.exe" --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --title "NOVA PC BOOST $tag" --notes $notes --latest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

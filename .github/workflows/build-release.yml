name: Build native Windows app and publish release
concurrency:
  group: nova-pc-boost-release
  cancel-in-progress: false
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'app/**'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore app/NovaPCBoost.csproj
      - name: Build and publish single-file Windows app
        run: dotnet publish app/NovaPCBoost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
      - name: Publish EXE to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.8.0' }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $notes = @'
          NOVA PC BOOST v1.8.0 — major visual redesign, native Windows app on C# / WPF.

          • Полностью обновлённый NOVA visual system: dark surfaces, lime accents, soft glows and animated controls
          • Обновлённый dashboard with animated NOVA core and refined system monitor cards
          • Игровые профили CS2, Rust и Dota 2
          • Более 60 пользовательских твиков Windows для приватности, интерфейса, Проводника и фоновой активности
          • 10 управляемых служб Windows с запросом UAC и сохранением исходного типа запуска/состояния для отката
          • Локальные резервные копии настроек и восстановление изменений
          • Мониторинг CPU, RAM и диска, системные инструменты и очистка пользовательских временных файлов

          Проверьте EXE антивирусом перед запуском.
          '@
          gh release create $tag "publish/NOVA_PC_BOOST.exe" --title "NOVA PC BOOST $tag" --notes $notes --latest
          if ($LASTEXITCODE -ne 0) {
            gh release upload $tag "publish/NOVA_PC_BOOST.exe" --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --title "NOVA PC BOOST $tag" --notes $notes --latest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

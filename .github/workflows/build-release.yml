name: Build native Windows app and publish release
concurrency:
  group: nova-pc-boost-release
  cancel-in-progress: false
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'app/**'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore app/NovaPCBoost.csproj
      - name: Build and publish single-file Windows app
        run: dotnet publish app/NovaPCBoost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
      - name: Publish EXE to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.10.0' }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $notes = @'
          NOVA PC BOOST v1.10.0 — безопасный откат, проверка обновлений и улучшенный benchmark.

          • Диагностика Windows, версии ОС, CPU, доступных сведений о GPU, RAM, системного диска и плана питания
          • Ручное сравнение среднего FPS и 1% low до/после с локальным сохранением результатов; приложение не имитирует измерение FPS
          • Подтверждение твиков с описанием рисков; проверка записи и восстановления значений реестра
          • Резервные копии записываются атомарно до изменения параметров; новые изменения блокируются, если копии повреждены
          • Автоматическая попытка отката при частичной ошибке; проверка фактического восстановления служб
          • Локальный журнал действий, очистки и ошибок
          • Управление службами с сохранением исходного типа запуска и состояния для отката
          • Проверка доступного релиза по кнопке через официальный GitHub API; приложение не скачивает обновления автоматически
          • Игровые профили CS2, Rust и Dota 2; системные инструменты и очистка временных файлов

          Проверьте EXE антивирусом перед запуском.
          '@
          gh release create $tag "publish/NOVA_PC_BOOST.exe" --title "NOVA PC BOOST $tag" --notes $notes --latest
          if ($LASTEXITCODE -ne 0) {
            gh release upload $tag "publish/NOVA_PC_BOOST.exe" --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --title "NOVA PC BOOST $tag" --notes $notes --latest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

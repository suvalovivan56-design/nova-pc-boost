name: Build Windows EXE and publish release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Build standalone EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name NOVA_PC_BOOST --collect-all psutil app/NovaPCBoost.py
      - name: Publish EXE to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist/NOVA_PC_BOOST.exe" --title "NOVA PC BOOST ${{ github.ref_name }}" --notes "Бесплатная сборка NOVA PC BOOST для Windows. Проверьте файл антивирусом перед запуском." --latest
